        const Toast = ({ message, type = 'success', onClose }) => {

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled = false, type = "button" }) => {

                danger: "bg-red-50 text-red-600 hover:bg-red-100",

            return <button type={type} onClick={onClick} disabled={disabled} className={`w-full py-3.5 px-6 rounded-full font-semibold transition-all active:scale-[0.98] flex items-center justify-center gap-2 ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>{children}</button>;

                </select>

        const Avatar = ({ src, name, size = "md" }) => {

                                {view === 'progress' && <ProgressView user={user} checkpoints={checkpoints} submissions={submissions} showToast={showToast} goalsMap={goalsMap} notifsMap={notifsMap} />}
                                {view === 'find_friends' && <FindFriendsView user={user} allUsers={allUsers} navigate={navigate} follows={follows} notifsMap={notifsMap} showToast={showToast} />}
                                {view === 'profile' && <MyProfileView user={user} logout={logout} showToast={showToast} navigate={navigate} follows={follows} checkpoints={checkpoints} allUsers={allUsers} />}
                                {view === 'other_profile' && <OtherProfileView currentUser={user} targetUser={allUsers.find(u => u.id === window.targetUserId)} navigate={navigate} showToast={showToast} checkpoints={checkpoints} follows={follows} allUsers={allUsers} />}
                                {view === 'notifications' && <NotificationsView user={user} navigate={navigate} notifsMap={notifsMap} />}

                        {user && user.role === 'admin' && (

                                {view === 'admin_members' && <AdminMembers allUsers={allUsers} navigate={navigate} />}
                                {view === 'admin_checkpoints' && <AdminCheckpoints checkpoints={checkpoints} />}
                                {view === 'admin_approvals' && <AdminApprovals submissions={submissions} allUsers={allUsers} showToast={showToast} notifsMap={notifsMap} />}

                    </div>

                </div>

        };

        const WelcomeView = ({ onNavigate }) => (
            <div className="h-full flex flex-col items-center justify-center p-8 bg-slate-50 text-center fade-in">
                <div className="mb-12">
                    <div className="waveform mb-8"><div className="bar"></div><div className="bar"></div><div className="bar"></div><div className="bar"></div><div className="bar"></div></div>
                    <h1 className="text-3xl font-bold tracking-tight text-brand-dark mb-2">MUSIC JOURNEY</h1>
                    <p className="text-sm font-medium text-slate-500 mb-6">Modern Musik — SMAN 1 Pangalengan</p>
                    <p className="text-xl font-medium text-slate-700 italic">"Your musical journey starts here."</p>
                </div>
                <div className="w-full space-y-4"><Button onClick={() => onNavigate('auth')}>Masuk / Daftar</Button></div>
            </div>
        );

        const AuthView = ({ onLogin, showToast, allUsers, onBack }) => {
            const [mode, setMode] = useState('login');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [nama, setNama] = useState('');
            const [kelas, setKelas] = useState('');
            const [divisi, setDivisi] = useState('');
            const [showPass, setShowPass] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!username.trim() || !password.trim()) return showToast("Username dan password wajib diisi.", "error");
                
                const cleanUser = username.trim().toLowerCase();
                const hashedPass = await window.hashPassword(password);
                const currentUsers = getStorageData('users', allUsers);

                if (mode === 'login') {
                    const found = currentUsers.find(u => u.username === cleanUser && u.password_hash === hashedPass);
                    if (!found) return showToast("Username atau password salah.", "error");
                    onLogin(found);
                } else {
                    if (!nama || !kelas || !divisi) return showToast("Semua field wajib diisi.", "error");
                    if (password !== confirmPassword) return showToast("Kata sandi tidak cocok.", "error");
                    if (currentUsers.some(u => u.username === cleanUser)) return showToast("Username sudah digunakan.", "error");

                    const newUser = {
                        id: 'user_' + Date.now(),
                        nama_lengkap: nama,
                        kelas, divisi,
                        username: cleanUser,
                        password_hash: hashedPass,
                        role: 'member',
                        progress: [],
                        badges: ['FIRST STEP'],
                        created_at: Date.now()
                    };
                    const updatedUsers = [...currentUsers, newUser];
                    setStorageData('users', updatedUsers);
                    showToast("Akun berhasil dibuat!");
                    onLogin(newUser);
                }
            };

            return (
                <div className="min-h-full flex flex-col p-6 bg-white fade-in">
                    <button onClick={onBack} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-500 mb-6 hover:bg-slate-100"><Icon name="ArrowLeft" size={20} /></button>
                    <h2 className="text-2xl font-bold mb-2">{mode === 'login' ? 'Selamat Datang Kembali' : 'Mulai Perjalananmu'}</h2>
                    <p className="text-slate-500 mb-8">{mode === 'login' ? 'Masuk untuk melanjutkan.' : 'Buat akun untuk melacak progress musikmu.'}</p>
                    <form onSubmit={handleSubmit} className="space-y-4 flex-1">
                        {mode === 'register' && (
                            <>
                                <Input label="Nama Lengkap" value={nama} onChange={e => setNama(e.target.value)} icon="User" placeholder="Dara Sabrina" />
                                <div className="flex gap-4">
                                    <Input label="Kelas" value={kelas} onChange={e => setKelas(e.target.value)} placeholder="XI-B1" />
                                    <Select label="Divisi" value={divisi} onChange={e => setDivisi(e.target.value)} options={['Vokal', 'Gitar', 'Bass', 'Drum', 'Dance']} />
                                </div>
                            </>
                        )}
                        <Input label="Username" value={username} onChange={e => setUsername(e.target.value.replace(/\s/g, ''))} icon="AtSign" placeholder="username" />
                        <div className="relative">
                            <Input label="Kata Sandi" type={showPass ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)} icon="Lock" placeholder="••••••••" />
                            <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-4 top-9 text-slate-400"><Icon name={showPass ? "EyeOff" : "Eye"} size={18} /></button>
                        </div>
                        {mode === 'register' && <Input label="Konfirmasi Kata Sandi" type={showPass ? "text" : "password"} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} icon="Lock" placeholder="••••••••" />}
                        <div className="pt-6"><Button type="submit">{mode === 'login' ? 'Masuk' : 'Buat Akun'}</Button></div>
                    </form>
                    <div className="mt-8 text-center text-sm text-slate-500 pb-8">
                        {mode === 'login' ? "Belum punya akun? " : "Sudah punya akun? "}
                        <button onClick={() => setMode(mode === 'login' ? 'register' : 'login')} className="font-semibold text-brand-pink hover:underline">{mode === 'login' ? 'Buat Akun' : 'Masuk'}</button>
                    </div>

        const TopBar = ({ title, onBack, rightElement }) => (
            <div className="flex items-center justify-between p-4 glass-nav sticky top-0 z-20">
                {onBack ? <button onClick={onBack} className="p-2 -ml-2 rounded-full hover:bg-slate-100 text-slate-600"><Icon name="ArrowLeft" size={24} /></button> : <div className="w-10"></div>}
                <h1 className="text-lg font-semibold flex-1 text-center truncate px-2">{title}</h1>
                <div className="w-10 flex justify-end">{rightElement}</div>
            </div>
        );

        const MemberBottomNav = ({ view, navigate }) => {
            const items = [{ id: 'dashboard', icon: 'Home', label: 'Home' }, { id: 'progress', icon: 'Target', label: 'Progress' }, { id: 'find_friends', icon: 'Search', label: 'Find' }, { id: 'profile', icon: 'User', label: 'Profile' }];
            return (
                <div className="absolute bottom-0 left-0 right-0 w-full glass-nav pb-safe pt-2 px-6 pb-4 sm:rounded-b-3xl z-30">
                    <div className="flex justify-between items-center max-w-sm mx-auto">
                        {items.map(item => (
                            <button key={item.id} onClick={() => navigate(item.id)} className={`flex flex-col items-center gap-1 p-2 ${view === item.id ? 'text-brand-pink' : 'text-slate-400'}`}>
                                <Icon name={item.icon} size={24} />
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );

        const MemberDashboard = ({ user, navigate, allUsers, checkpoints, notifsMap }) => {
            const divisionCP = useMemo(() => checkpoints.filter(c => c.divisi === user.divisi), [checkpoints, user.divisi]);
            const completedCount = (user.progress || []).filter(pid => divisionCP.some(c => c.id === pid)).length;
            const percentage = divisionCP.length > 0 ? (completedCount / divisionCP.length) * 100 : 0;
            const nextMission = divisionCP.find(c => !(user.progress || []).includes(c.id));

            const myNotifs = notifsMap[user.id] || [];
            const unreadCount = myNotifs.filter(n => !n.is_read).length;

            const rankings = useMemo(() => {
                return allUsers.filter(u => u.divisi === user.divisi && u.role === 'member').map(m => {
                    const mComp = (m.progress || []).filter(pid => divisionCP.some(c => c.id === pid)).length;
                    return { ...m, perc: divisionCP.length ? (mComp / divisionCP.length) * 100 : 0 };
                }).sort((a,b) => b.perc - a.perc).slice(0, 5);
            }, [allUsers, user.divisi, divisionCP]);

            return (
                <div className="fade-in pb-20">
                    <div className="px-6 pt-8 pb-4 bg-gradient-to-br from-brand-pink/5 to-transparent flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold">Halo, {user.nama_lengkap.split(' ')[0]} 👋</h1>
                            <p className="text-slate-500 text-sm mt-1">Ready to continue your journey?</p>
                        </div>
                        <button onClick={() => navigate('notifications')} className="relative p-2.5 bg-white rounded-full shadow-sm border border-slate-100 text-slate-600">
                            <Icon name="Bell" size={20} />

                        </button>
                    </div>
                    <div className="px-6 space-y-6">
                        <div className="bg-brand-dark text-white rounded-3xl p-6 shadow-lg relative overflow-hidden">

                            <div className="flex items-end justify-between mb-4">
                                <div className="text-4xl font-bold">{Math.round(percentage)}%</div>
                                <div className="text-sm text-slate-300 bg-white/10 px-3 py-1 rounded-full">{completedCount}/{divisionCP.length} Checkpoints</div>
                            </div>
                            <ProgressBar percentage={percentage} />
                        </div>
                        {nextMission && (
                            <div>
                                <h3 className="text-sm font-bold text-slate-500 mb-3 uppercase px-2">Next Mission</h3>
                                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex items-center justify-between gap-4">
                                    <div className="flex items-center gap-3 truncate">
                                        <div className="w-10 h-10 rounded-full bg-pink-50 flex items-center justify-center text-brand-pink shrink-0"><Icon name="Music" size={20} /></div>
                                        <div className="truncate"><h4 className="font-semibold text-sm truncate">{nextMission.nama}</h4><p className="text-xs text-slate-500">Level {nextMission.level}</p></div>

                                    <button onClick={() => navigate('progress')} className="text-xs font-semibold text-brand-pink bg-pink-50 px-3 py-1.5 rounded-full shrink-0 flex items-center gap-1">Continue <Icon name="ArrowRight" size={12} /></button>

                                        <div className="w-6 text-center text-sm font-bold text-slate-400">{idx + 1}</div>
                                        <Avatar src={m.foto_profil} name={m.nama_lengkap} size="sm" />
                                        <div className="flex-1 min-w-0"><h4 className="font-semibold text-sm truncate">{m.nama_lengkap}</h4><p className="text-xs text-slate-500 truncate">@{m.username}</p></div>
                                        <div className="text-sm font-bold bg-slate-50 px-2 py-1 rounded-lg">{Math.round(m.perc)}%</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ProgressView = ({ user, checkpoints, submissions, showToast, goalsMap, notifsMap }) => {
            const [tab, setTab] = useState('journey');
            const divisionCP = useMemo(() => checkpoints.filter(c => c.divisi === user.divisi), [checkpoints, user.divisi]);
            const mySubs = useMemo(() => submissions.filter(s => s.user_id === user.id), [submissions, user.id]);
            const [selectedCp, setSelectedCp] = useState(null);
            const [showConfirmModal, setShowConfirmModal] = useState(false);

            const myGoals = goalsMap[user.id] || [];
            const [showGoalForm, setShowGoalForm] = useState(false);
            const [editingGoalId, setEditingGoalId] = useState(null);
            const [goalTitle, setGoalTitle] = useState('');
            const [goalDesc, setGoalDesc] = useState('');

            const handleSaveGoal = (e) => {
                e.preventDefault();
                if (!goalTitle.trim()) return showToast("Nama goal wajib diisi.", "error");
                let updatedGoals = [...myGoals];
                if (editingGoalId) {
                    updatedGoals = updatedGoals.map(g => g.id === editingGoalId ? { ...g, title: goalTitle, description: goalDesc } : g);
                } else {
                    updatedGoals.push({ id: 'goal_' + Date.now(), title: goalTitle, description: goalDesc, progress: 0 });
                }
                setStorageData('goalsMap', { ...goalsMap, [user.id]: updatedGoals });
                showToast("Goal berhasil disimpan!");
                setShowGoalForm(false);
                setEditingGoalId(null);
                setGoalTitle('');
                setGoalDesc('');
            };

            const updateGoalProg = (goalId, val) => {
                const updatedGoals = myGoals.map(g => g.id === goalId ? { ...g, progress: val } : g);
                setStorageData('goalsMap', { ...goalsMap, [user.id]: updatedGoals });
            };

            const deleteGoal = (goalId) => {
                const updatedGoals = myGoals.filter(g => g.id !== goalId);
                setStorageData('goalsMap', { ...goalsMap, [user.id]: updatedGoals });
                showToast("Goal dihapus.");
            };

            const confirmSubmit = () => {
                let subs = getStorageData('submissions', []);
                if (subs.some(s => s.user_id === user.id && s.checkpoint_id === selectedCp.id && s.status === 'pending')) {
                    return showToast("Checkpoint ini sudah diajukan.", "error");
                }
                subs.push({
                    id: 'sub_' + Date.now(),
                    user_id: user.id,
                    user_name: user.nama_lengkap,
                    user_username: user.username,
                    user_kelas: user.kelas,
                    user_divisi: user.divisi,
                    checkpoint_id: selectedCp.id,
                    checkpoint_name: selectedCp.nama,
                    checkpoint_level: selectedCp.level,
                    status: 'pending',
                    submitted_at: Date.now()
                });
                setStorageData('submissions', subs);

                let notifs = notifsMap[user.id] || [];
                notifs.unshift({ id: 'notif_' + Date.now(), title: 'Checkpoint Diajukan', message: `Pengajuan "${selectedCp.nama}" sedang menunggu persetujuan admin.`, is_read: false, created_at: Date.now() });
                setStorageData('notifsMap', { ...notifsMap, [user.id]: notifs });

                showToast("Checkpoint berhasil diajukan!");
                setSelectedCp(null);
                setShowConfirmModal(false);
            };

            return (
                <div className="fade-in pb-24">
                    <TopBar title="Progress" />
                    {selectedCp && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl relative">
                                <button onClick={() => { setSelectedCp(null); setShowConfirmModal(false); }} className="absolute top-4 right-4 text-slate-400 bg-slate-50 rounded-full p-2"><Icon name="X" size={20} /></button>
                                <Badge variant="purple">LEVEL {selectedCp.level}</Badge>
                                <h2 className="text-xl font-bold mt-3 mb-2">{selectedCp.nama}</h2>
                                <p className="text-xs text-slate-500 mb-6">Divisi {user.divisi}</p>
                                
                                {showConfirmModal ? (
                                    <div className="bg-pink-50 p-4 rounded-2xl border border-pink-100 space-y-3">
                                        <p className="text-sm font-semibold text-slate-800 text-center">Yakin ingin mengajukan checkpoint ini untuk disetujui?</p>
                                        <div className="flex gap-2">
                                            <Button variant="secondary" onClick={() => setShowConfirmModal(false)} className="flex-1">Tidak</Button>
                                            <Button variant="accent" onClick={confirmSubmit} className="flex-1">Ya, Submit</Button>
                                        </div>
                                    </div>
                                ) : (
                                    <Button onClick={() => setShowConfirmModal(true)}>Submit for Approval</Button>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="px-6 py-2 sticky top-16 bg-slate-50/90 backdrop-blur-md z-10">
                        <div className="flex bg-slate-200/50 p-1 rounded-xl">
                            <button onClick={() => setTab('journey')} className={`flex-1 py-2 text-sm font-medium rounded-lg ${tab === 'journey' ? 'bg-white shadow-sm text-brand-dark' : 'text-slate-500'}`}>Official Journey</button>
                            <button onClick={() => setTab('goals')} className={`flex-1 py-2 text-sm font-medium rounded-lg ${tab === 'goals' ? 'bg-white shadow-sm text-brand-dark' : 'text-slate-500'}`}>My Goals</button>
                        </div>
                    </div>

                    <div className="px-6 pt-4">
                        {tab === 'journey' && (
                            <div className="space-y-6">
                                {[1, 2, 3].map(level => {
                                    const cps = divisionCP.filter(c => c.level === level);
                                    if (!cps.length) return null;
                                    return (
                                        <div key={level}>
                                            <h3 className="font-bold text-slate-800 mb-3">LEVEL {level}</h3>
                                            <div className="space-y-3">
                                                {cps.map(cp => {
                                                    const isDone = (user.progress || []).includes(cp.id);
                                                    const pending = mySubs.some(s => s.checkpoint_id === cp.id && s.status === 'pending');
                                                    const rejected = mySubs.some(s => s.checkpoint_id === cp.id && s.status === 'rejected');
                                                    return (
                                                        <div key={cp.id} onClick={() => !isDone && !pending && setSelectedCp(cp)} className={`bg-white p-4 rounded-2xl border flex justify-between items-center cursor-pointer ${isDone ? 'bg-emerald-50/30 border-emerald-100' : pending ? 'bg-amber-50/30 border-amber-100' : rejected ? 'bg-red-50/30 border-red-100' : 'border-slate-100'}`}>
                                                            <div>
                                                                <h4 className="font-semibold text-sm">{cp.nama}</h4>
                                                                {rejected && <p className="text-[10px] text-red-500 mt-1">Ditolak, ketuk untuk ajukan ulang</p>}
                                                            </div>
                                                            <Badge variant={isDone ? 'success' : pending ? 'warning' : rejected ? 'danger' : 'default'}>{isDone ? 'Completed' : pending ? 'Pending' : rejected ? 'Rejected' : 'In Progress'}</Badge>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {tab === 'goals' && (
                            <div className="space-y-4">
                                {showGoalForm ? (
                                    <form onSubmit={handleSaveGoal} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 className="font-bold text-sm">{editingGoalId ? 'Edit Goal' : 'Buat Goal Baru'}</h3>
                                        <Input label="Nama Goal" value={goalTitle} onChange={e => setGoalTitle(e.target.value)} placeholder="Contoh: Menguasai teknik solo gitar..." />
                                        <div className="space-y-1.5">
                                            <label className="block text-sm font-medium text-slate-700">Deskripsi (Opsional)</label>
                                            <textarea value={goalDesc} onChange={e => setGoalDesc(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-brand-pink h-20"></textarea>
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            <Button variant="ghost" type="button" onClick={() => { setShowGoalForm(false); setEditingGoalId(null); setGoalTitle(''); setGoalDesc(''); }}>Batal</Button>
                                            <Button type="submit">Simpan</Button>
                                        </div>
                                    </form>
                                ) : (
                                    <Button variant="secondary" onClick={() => { setEditingGoalId(null); setGoalTitle(''); setGoalDesc(''); setShowGoalForm(true); }} className="border-dashed border-2 text-brand-pink">
                                        <Icon name="Plus" size={20} /> Add Goal
                                    </Button>
                                )}

                                {myGoals.length === 0 && !showGoalForm ? (
                                    <div className="text-center py-12 text-slate-400">
                                        <Icon name="Target" size={40} className="mx-auto mb-3 opacity-30" />
                                        <p className="text-sm">Belum ada goal. Mulai buat target musikmu!</p>
                                    </div>
                                ) : (
                                    myGoals.map(goal => (
                                        <div key={goal.id} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold text-slate-800">{goal.title}</h4>
                                                    {goal.description && <p className="text-xs text-slate-500 mt-0.5">{goal.description}</p>}
                                                </div>
                                                <div className="flex gap-1">
                                                    <button onClick={() => { setEditingGoalId(goal.id); setGoalTitle(goal.title); setGoalDesc(goal.description || ''); setShowGoalForm(true); }} className="text-slate-400 hover:text-brand-pink p-1"><Icon name="Edit2" size={16} /></button>
                                                    <button onClick={() => deleteGoal(goal.id)} className="text-slate-400 hover:text-red-500 p-1"><Icon name="Trash2" size={16} /></button>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1"><ProgressBar percentage={goal.progress} /></div>
                                                <span className="text-xs font-bold text-slate-600 w-8">{goal.progress}%</span>
                                            </div>
                                            <div className="flex gap-2">
                                                {[0, 25, 50, 75, 100].map(val => (
                                                    <button key={val} onClick={() => updateGoalProg(goal.id, val)} className={`flex-1 py-1 rounded text-xs font-medium transition-colors ${goal.progress === val ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`}>{val}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FindFriendsView = ({ user, allUsers, navigate, follows, notifsMap, showToast }) => {
            const [search, setSearch] = useState('');
            const followingList = useMemo(() => follows.filter(f => f.follower_id === user.id).map(f => f.following_id), [follows, user.id]);

            const results = useMemo(() => {
                const query = search.toLowerCase().trim();
                const members = allUsers.filter(u => u.role === 'member' && u.id !== user.id);
                if (!query) return members;
                return members.filter(u => (u.username && u.username.toLowerCase().includes(query)) || (u.nama_lengkap && u.nama_lengkap.toLowerCase().includes(query)));
            }, [allUsers, search, user.id]);

            const handleFollow = (targetId, targetName) => {
                let fList = getStorageData('follows', []);
                const isFollowed = followingList.includes(targetId);
                if (isFollowed) {
                    fList = fList.filter(f => !(f.follower_id === user.id && f.following_id === targetId));
                    showToast("Berhasil berhenti mengikuti.");
                } else {
                    fList.push({ follower_id: user.id, following_id: targetId, created_at: Date.now() });
                    
                    let tNotifs = notifsMap[targetId] || [];
                    tNotifs.unshift({ id: 'notif_' + Date.now(), title: 'Pengikut Baru', message: `@${user.username} mulai mengikuti Anda.`, is_read: false, created_at: Date.now() });
                    setStorageData('notifsMap', { ...notifsMap, [targetId]: tNotifs });

                    showToast(`Mulai mengikuti @${targetName}`);
                }
                setStorageData('follows', fList);
            };

            return (
                <div className="fade-in pb-24">
                    <div className="p-6 pb-2 glass-nav sticky top-0"><h1 className="text-2xl font-bold mb-4">Find Friends</h1><Input value={search} onChange={e => setSearch(e.target.value)} placeholder="Cari nama atau username..." icon="Search" /></div>
                    <div className="px-6 pt-4 space-y-3">
                        {results.length === 0 ? (
                            <div className="text-center py-12 text-slate-400"><Icon name="Users" size={40} className="mx-auto mb-3 opacity-30" /><p className="text-sm">Tidak ada anggota yang ditemukan.</p></div>
                        ) : (
                            results.map(m => {
                                const isF = followingList.includes(m.id);
                                return (
                                    <div key={m.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex items-center gap-4">
                                        <div onClick={() => { window.targetUserId = m.id; navigate('other_profile'); }} className="cursor-pointer shrink-0"><Avatar src={m.foto_profil} name={m.nama_lengkap} size="md" /></div>
                                        <div className="flex-1 truncate cursor-pointer" onClick={() => { window.targetUserId = m.id; navigate('other_profile'); }}>
                                            <h4 className="font-semibold text-sm truncate">{m.nama_lengkap}</h4>
                                            <p className="text-xs text-slate-500 truncate">@{m.username}</p>
                                        </div>
                                        <button onClick={() => handleFollow(m.id, m.username)} className={`text-xs font-semibold px-4 py-2 rounded-full ${isF ? 'bg-slate-100 text-slate-600' : 'bg-brand-dark text-white'}`}>{isF ? 'Following' : 'Follow'}</button>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const ProfileContent = ({ profileUser, isMe, navigate, logout, follows, checkpoints, showToast, allUsers }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [modalListType, setModalListType] = useState(null);
            const [nama, setNama] = useState(profileUser.nama_lengkap);
            const [kelas, setKelas] = useState(profileUser.kelas);
            const [divisi, setDivisi] = useState(profileUser.divisi);
            const [foto, setFoto] = useState(profileUser.foto_profil || '');

            const fileRef = useRef(null);
            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => setFoto(ev.target.result);
                reader.readAsDataURL(file);
            };

            const handleSave = (e) => {
                e.preventDefault();
                let users = getStorageData('users', []);
                users = users.map(u => u.id === profileUser.id ? { ...u, nama_lengkap: nama, kelas, divisi, foto_profil: foto } : u);
                setStorageData('users', users);
                showToast("Profil diperbarui!");
                setIsEditing(false);
            };

            const handleDeleteAccount = () => {
                let users = getStorageData('users', []).filter(u => u.id !== profileUser.id);
                setStorageData('users', users);
                showToast("Akun berhasil dihapus.");
                logout();
            };

            const currentUser = getStorageData('current_user', null);
            const myFollowingList = useMemo(() => follows.filter(f => f.follower_id === currentUser?.id).map(f => f.following_id), [follows, currentUser]);
            const isFollowedByMe = myFollowingList.includes(profileUser.id);

            const handleToggleFollow = () => {
                if (!currentUser) return;
                let fList = getStorageData('follows', []);
                if (isFollowedByMe) {
                    fList = fList.filter(f => !(f.follower_id === currentUser.id && f.following_id === profileUser.id));
                    showToast("Berhasil berhenti mengikuti.");
                } else {
                    fList.push({ follower_id: currentUser.id, following_id: profileUser.id, created_at: Date.now() });
                    showToast(`Mulai mengikuti @${profileUser.username}`);
                }
                setStorageData('follows', fList);
            };

            const followersIds = follows.filter(f => f.following_id === profileUser.id).map(f => f.follower_id);
            const followingIds = follows.filter(f => f.follower_id === profileUser.id).map(f => f.following_id);

            const followersUsers = allUsers.filter(u => followersIds.includes(u.id));
            const followingUsers = allUsers.filter(u => followingIds.includes(u.id));

            const completedCP = (profileUser.progress || []).length;
            const badges = profileUser.badges || ['FIRST STEP'];

            return (
                <div className="fade-in pb-24">
                    {isMe ? <TopBar title="My Profile" rightElement={<button onClick={logout} className="text-red-500"><Icon name="LogOut" size={20}/></button>} /> : <TopBar title={profileUser.username} onBack={() => navigate('find_friends')} />}
                    
                    {modalListType && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl relative max-h-[80vh] flex flex-col">
                                <button onClick={() => setModalListType(null)} className="absolute top-4 right-4 text-slate-400 bg-slate-50 rounded-full p-2"><Icon name="X" size={20} /></button>
                                <h3 className="font-bold text-lg mb-4 capitalize">{modalListType}</h3>
                                <div className="space-y-3 overflow-y-auto flex-1 pr-1">
                                    {(modalListType === 'followers' ? followersUsers : followingUsers).length === 0 ? (
                                        <p className="text-center text-slate-400 py-8 text-sm">Tidak ada daftar.</p>
                                    ) : (
                                        (modalListType === 'followers' ? followersUsers : followingUsers).map(u => (
                                            <div key={u.id} onClick={() => { setModalListType(null); window.targetUserId = u.id; navigate('other_profile'); }} className="flex items-center gap-3 p-3 bg-slate-50 rounded-2xl cursor-pointer hover:bg-slate-100">
                                                <Avatar src={u.foto_profil} name={u.nama_lengkap} size="sm" />
                                                <div className="flex-1 truncate"><h4 className="font-semibold text-sm truncate">{u.nama_lengkap}</h4><p className="text-xs text-slate-500 truncate">@{u.username}</p></div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {isEditing && isMe && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <form onSubmit={handleSave} className="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg">Edit Profil</h3>
                                <div className="flex flex-col items-center gap-2">
                                    <Avatar src={foto} name={nama} size="lg" />
                                    <input type="file" ref={fileRef} onChange={handleFile} accept="image/*" className="hidden" />
                                    <Button type="button" variant="secondary" onClick={() => fileRef.current?.click()} className="text-xs py-2 w-auto">Ganti Foto</Button>
                                </div>
                                <Input label="Nama" value={nama} onChange={e => setNama(e.target.value)} />
                                <Input label="Kelas" value={kelas} onChange={e => setKelas(e.target.value)} />
                                <Select label="Divisi" value={divisi} onChange={e => setDivisi(e.target.value)} options={['Vokal', 'Gitar', 'Bass', 'Drum', 'Dance']} />
                                <div className="flex gap-2 pt-2"><Button variant="ghost" type="button" onClick={() => setIsEditing(false)}>Batal</Button><Button type="submit">Simpan</Button></div>
                            </form>
                        </div>
                    )}

                    {showDeleteModal && isMe && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
                                <h3 className="font-bold text-lg text-slate-800">Yakin ingin menghapus akun?</h3>
                                <p className="text-xs text-slate-500 leading-relaxed">Semua data akun, progress, goals, dan pencapaianmu akan dihapus secara permanen.</p>
                                <div className="flex gap-2 pt-2">
                                    <Button variant="secondary" onClick={() => setShowDeleteModal(false)} className="flex-1">Batal</Button>
                                    <Button variant="danger" onClick={handleDeleteAccount} className="flex-1">Hapus</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="px-6 pt-6 flex flex-col items-center">
                        <Avatar src={profileUser.foto_profil} name={profileUser.nama_lengkap} size="xl" />
                        <h2 className="text-xl font-bold mt-4">{profileUser.nama_lengkap}</h2>
                        <p className="text-slate-500 text-sm">@{profileUser.username} • {profileUser.kelas}</p>
                        <Badge variant="pink" className="mt-2">{profileUser.divisi}</Badge>

                        <div className="flex w-full mt-6 gap-4">
                            <div className="flex-1 text-center bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><div className="text-lg font-bold">{completedCP}</div><div className="text-[10px] uppercase text-slate-400 font-bold">Checkpoints</div></div>
                            <div onClick={() => setModalListType('followers')} className="flex-1 text-center bg-white p-3 rounded-2xl border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-50"><div className="text-lg font-bold">{followersIds.length}</div><div className="text-[10px] uppercase text-slate-400 font-bold">Followers</div></div>
                            <div onClick={() => setModalListType('following')} className="flex-1 text-center bg-white p-3 rounded-2xl border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-50"><div className="text-lg font-bold">{followingIds.length}</div><div className="text-[10px] uppercase text-slate-400 font-bold">Following</div></div>
                        </div>

                        {isMe ? (
                            <div className="w-full mt-6 space-y-3">
                                <Button variant="secondary" onClick={() => setIsEditing(true)}>Edit Profile</Button>
                                <Button variant="danger" onClick={() => setShowDeleteModal(true)} className="text-xs py-2.5">Delete Account</Button>
                            </div>
                        ) : (
                            <div className="w-full mt-6">
                                <Button onClick={handleToggleFollow} variant={isFollowedByMe ? "secondary" : "accent"}>{isFollowedByMe ? "Following" : "Follow"}</Button>
                            </div>
                        )}
                    </div>

                    <div className="px-6 mt-8 space-y-4">
                        <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wide">Achievements</h3>
                        <div className="grid grid-cols-2 gap-3">
                            {badges.map(b => (
                                <div key={b} className="bg-pink-50/50 p-4 rounded-2xl border border-pink-100 flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-pink-100 text-brand-pink flex items-center justify-center"><Icon name="Zap" size={16} /></div>
                                    <span className="text-xs font-bold text-slate-700">{b}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {isMe && (
                        <div className="mt-16 px-6 text-center pb-8 opacity-80">
                            <div className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400"><Icon name="Heart" size={16} /></div>
                            <h3 className="text-sm font-bold mb-2 text-slate-700">Thank You for Being Part of Music Journey ♡</h3>
                            <p className="text-[11px] leading-relaxed text-slate-500 mb-3">Thank you for being part of Music Journey. This app was created to make every step of your musical journey feel more meaningful...</p>
                            <div className="text-[10px] font-medium text-slate-400">
                                Made with love by Dara Sabrina<br/>
                                <a href="https://instagram.com/___sbreena" target="_blank" className="text-brand-pink hover:underline mt-1 inline-block">Instagram: @___sbreena</a>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MyProfileView = ({ user, logout, showToast, navigate, follows, checkpoints, allUsers }) => <ProfileContent profileUser={user} isMe={true} navigate={navigate} logout={logout} follows={follows} checkpoints={checkpoints} showToast={showToast} allUsers={allUsers} />;
        
        const OtherProfileView = ({ currentUser, targetUser, navigate, checkpoints, follows, showToast, allUsers }) => {
            if (!targetUser) return <div className="p-8 text-center">User not found</div>;
            return <ProfileContent profileUser={targetUser} isMe={false} navigate={navigate} follows={follows} checkpoints={checkpoints} showToast={showToast} allUsers={allUsers} />;
        };

        const NotificationsView = ({ user, navigate, notifsMap }) => {
            const notifs = notifsMap[user.id] || [];

            const markAllRead = () => {
                const updated = notifs.map(n => ({ ...n, is_read: true }));
                setStorageData('notifsMap', { ...notifsMap, [user.id]: updated });
            };

            const formatTime = (ts) => {
                const diff = Date.now() - ts;
                if(diff < 60000) return 'Baru saja';
                if(diff < 3600000) return `${Math.floor(diff/60000)}m yang lalu`;
                if(diff < 86400000) return `${Math.floor(diff/3600000)}j yang lalu`;
                return new Date(ts).toLocaleDateString();
            };

            return (
                <div className="fade-in pb-24 bg-slate-50 min-h-full">
                    <TopBar title="Notifications" onBack={() => navigate('dashboard')} />
                    <div className="px-6 py-4 flex justify-between items-center">
                        <span className="text-sm font-bold text-slate-500 uppercase tracking-wide">Terbaru</span>
                        {notifs.some(n => !n.is_read) && (
                            <button onClick={markAllRead} className="text-xs font-semibold text-brand-pink hover:underline">Mark all as read</button>
                        )}
                    </div>
                    <div className="px-6 space-y-3">
                        {notifs.length === 0 ? (
                            <div className="text-center py-12 text-slate-400">
                                <Icon name="BellOff" size={40} className="mx-auto mb-3 opacity-30" />
                                <p className="text-sm">Tidak ada notifikasi baru.</p>
                            </div>
                        ) : (
                            notifs.map(n => (
                                <div key={n.id} className={`p-4 rounded-2xl flex gap-4 items-start ${n.is_read ? 'bg-white border border-slate-100 shadow-sm opacity-75' : 'bg-pink-50 border border-pink-100 shadow-sm'}`}>
                                    <div className="w-10 h-10 rounded-full bg-pink-100 text-brand-pink flex items-center justify-center shrink-0">
                                        <Icon name="Bell" size={20} />
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h4 className={`text-sm ${n.is_read ? 'font-medium text-slate-700' : 'font-bold text-slate-900'}`}>{n.title}</h4>
                                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">{n.message}</p>
                                        <p className="text-[10px] text-slate-400 mt-2">{formatTime(n.created_at)}</p>
                                    </div>
                                    {!n.is_read && <div className="w-2 h-2 rounded-full bg-brand-pink mt-2 shrink-0"></div>}
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const AdminBottomNav = ({ view, navigate }) => {
            const items = [{ id: 'admin_dashboard', icon: 'LayoutDashboard', label: 'Home' }, { id: 'admin_members', icon: 'Users', label: 'Members' }, { id: 'admin_checkpoints', icon: 'ListChecks', label: 'CP' }, { id: 'admin_approvals', icon: 'CheckCircle', label: 'Approvals' }, { id: 'admin_profile', icon: 'Settings', label: 'Settings' }];
            return (
                <div className="absolute bottom-0 left-0 right-0 w-full bg-slate-900 text-slate-400 pb-safe pt-2 px-6 pb-4 sm:rounded-b-3xl z-30">
                    <div className="flex justify-between items-center max-w-sm mx-auto">
                        {items.map(item => (
                            <button key={item.id} onClick={() => navigate(item.id)} className={`flex flex-col items-center gap-1 p-2 ${view === item.id ? 'text-white' : 'hover:text-slate-200'}`}>
                                <Icon name={item.icon} size={22} />
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ allUsers, checkpoints }) => {
            const members = allUsers.filter(u => u.role === 'member');
            return (
                <div className="fade-in pb-24 bg-slate-50 min-h-full">
                    <div className="bg-slate-900 text-white pt-8 pb-12 px-6"><h1 className="text-2xl font-bold">Admin Workspace</h1><p className="text-slate-400 text-sm">Selamat datang, Admin.</p></div>
                    <div className="-mt-6 px-6 grid grid-cols-2 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm text-center"><div className="text-3xl font-bold mb-1">{members.length}</div><div className="text-xs text-slate-500 uppercase">Members</div></div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm text-center"><div className="text-3xl font-bold mb-1">{checkpoints.length}</div><div className="text-xs text-slate-500 uppercase">Checkpoints</div></div>
                    </div>
                </div>
            );
        };

        const AdminMembers = ({ allUsers, navigate }) => {
            const members = allUsers.filter(u => u.role === 'member');
            return (
                <div className="fade-in pb-24">
                    <TopBar title="Manage Members" />
                    <div className="px-6 pt-4 space-y-3">
                        {members.length === 0 ? (
                            <p className="text-center text-slate-400 py-8 text-sm">Belum ada member terdaftar.</p>
                        ) : (
                            members.map(m => (
                                <div key={m.id} onClick={() => { window.targetUserId = m.id; navigate('admin_member_detail'); }} className="bg-white p-4 rounded-2xl border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50">
                                    <Avatar src={m.foto_profil} name={m.nama_lengkap} size="md" />
                                    <div className="flex-1 truncate"><h4 className="font-semibold text-sm">{m.nama_lengkap}</h4><p className="text-xs text-slate-500">@{m.username}</p></div>
                                    <Badge>{m.divisi}</Badge>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const AdminMemberDetail = ({ user, navigate, checkpoints }) => {
            if (!user) return null;
            const total = checkpoints.filter(c => c.divisi === user.divisi).length;
            const done = (user.progress || []).length;
            return (
                <div className="fade-in pb-24">
                    <TopBar title="Detail Member" onBack={() => navigate('admin_members')} />
                    <div className="px-6 pt-6 flex flex-col items-center">
                        <Avatar src={user.foto_profil} name={user.nama_lengkap} size="xl" />
                        <h2 className="text-xl font-bold mt-4">{user.nama_lengkap}</h2>
                        <p className="text-slate-500 text-sm">@{user.username} • {user.kelas}</p>
                        <Badge variant="purple" className="mt-2">{user.divisi}</Badge>
                        <div className="w-full mt-6 bg-slate-900 text-white p-5 rounded-2xl"><div className="flex justify-between text-sm mb-2"><span>Progress</span><span>{done}/{total}</span></div><ProgressBar percentage={total ? (done/total)*100 : 0} /></div>
                    </div>
                </div>
            );
        };

        const AdminCheckpoints = ({ checkpoints }) => (
            <div className="fade-in pb-24"><TopBar title="Checkpoints" /><div className="px-6 pt-4 space-y-3">{checkpoints.map(c => <div key={c.id} className="bg-white p-4 rounded-2xl border"><h4 className="font-semibold text-sm">{c.nama}</h4><Badge>{c.divisi} - Level {c.level}</Badge></div>)}</div></div>
        );

        const AdminApprovals = ({ submissions, allUsers, showToast, notifsMap }) => {
            const pending = submissions.filter(s => s.status === 'pending');

            const handleApprove = (sub) => {
                let subs = getStorageData('submissions', []).map(s => s.id === sub.id ? { ...s, status: 'approved' } : s);
                setStorageData('submissions', subs);

                let users = getStorageData('users', []);
                users = users.map(u => {
                    if (u.id === sub.user_id) {
                        const prog = u.progress || [];
                        if (!prog.includes(sub.checkpoint_id)) prog.push(sub.checkpoint_id);
                        let badges = u.badges || ['FIRST STEP'];
                        if (prog.length >= 4 && !badges.includes('ACTIVE MEMBER')) badges.push('ACTIVE MEMBER');
                        return { ...u, progress: prog, badges };
                    }
                    return u;
                });
                setStorageData('users', users);

                let notifs = notifsMap[sub.user_id] || [];
                notifs.unshift({ id: 'notif_' + Date.now(), title: 'Checkpoint Disetujui! 🎉', message: `Checkpoint "${sub.checkpoint_name}" telah disetujui oleh admin.`, is_read: false, created_at: Date.now() });
                setStorageData('notifsMap', { ...notifsMap, [sub.user_id]: notifs });

                showToast("Pengajuan disetujui!");
            };

            const handleReject = (sub) => {
                let subs = getStorageData('submissions', []).map(s => s.id === sub.id ? { ...s, status: 'rejected' } : s);
                setStorageData('submissions', subs);

                let notifs = notifsMap[sub.user_id] || [];
                notifs.unshift({ id: 'notif_' + Date.now(), title: 'Checkpoint Ditolak', message: `Checkpoint "${sub.checkpoint_name}" ditolak. Silakan periksa kembali.`, is_read: false, created_at: Date.now() });
                setStorageData('notifsMap', { ...notifsMap, [sub.user_id]: notifs });

                showToast("Pengajuan ditolak.");
            };

            return (
                <div className="fade-in pb-24">
                    <TopBar title="Approvals" />
                    <div className="px-6 pt-4 space-y-3">
                        {pending.length === 0 ? <p className="text-center text-slate-400 py-8">Tidak ada pengajuan pending.</p> : pending.map(s => (
                            <div key={s.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                                <div><h4 className="font-bold text-sm">{s.user_name}</h4><p className="text-xs text-brand-pink font-medium">{s.checkpoint_name}</p><p className="text-[10px] text-slate-400">{s.user_divisi} - {s.user_kelas}</p></div>
                                <div className="flex gap-2"><Button variant="danger" onClick={() => handleReject(s)} className="text-xs py-2">Tolak</Button><Button onClick={() => handleApprove(s)} className="text-xs py-2">Setujui</Button></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminProfile = ({ user, logout }) => (
            <div className="fade-in h-full flex flex-col">
                <TopBar title="Settings" />
                <div className="p-6 flex flex-col items-center flex-1">
                    <Avatar name={user.nama_lengkap} size="xl" />
                    <h2 className="text-xl font-bold mt-4">{user.nama_lengkap}</h2>
                    <Badge variant="purple" className="mt-2">Administrator</Badge>
                    <div className="w-full mt-12"><Button variant="danger" onClick={logout}><Icon name="LogOut" size={20} /> Keluar Aplikasi</Button></div>
                </div>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
